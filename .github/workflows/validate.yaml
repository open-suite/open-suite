name: validate distribution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck gettext-base
      - name: Check shell
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck --severity=warning
      - name: Keep the k3s admin kubeconfig root-only
        run: |
          grep -Fq 'INSTALL_K3S_EXEC="--write-kubeconfig-mode 600"' scripts/single-vps-deploy/01-deploy.sh
          ! grep -Eq 'write-kubeconfig-mode[ =]+0?644' scripts/single-vps-deploy/01-deploy.sh
      - name: Check Nextcloud image source contracts
        run: bash images/nextcloud/test-source-shape.sh
      - name: Check Collabora image source contracts
        run: node ci/test-collabora-image-runtime.mjs
      - name: Test host state helpers
        run: bash ci/test-state.sh
      - name: Check JavaScript
        run: |
          node --check ci/smoke/authenticated.mjs
          node --check ci/smoke/visual-transitions.mjs
          node --check ci/smoke/visual-transition-helpers.mjs
          node --test ci/smoke/visual-transition-helpers.test.mjs
          node --test performance/reporting.test.mjs
          node --check overlays/portal-header/opensuite-header.js
          node ci/test-element-quick-wins.mjs
          node ci/test-element-sync-migration.mjs
      - name: Check PHP
        run: find images/nextcloud/meetcal -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check Nextcloud Whiteboard source contract
        run: bash ci/test-nextcloud-whiteboard.sh
      - name: Render environment values
        env:
          DOMAIN: example.test
          TLS_SELF_SIGNED: "true"
          INGRESS_ANNOTATIONS: ""
          NEXTCLOUD_TAG: 34.0.0-apache
          PORTAL_SHA: "34512e5"
          MEET_TAG: v1.20.0
          ELEMENT_TAG: sha-a11ee66
          COLLABORA_TAG: sha-6cbf822
          KC_BACKCHANNEL: http://keycloak-keycloak.mb-keycloak
        run: |
          envsubst '${DOMAIN} ${TLS_SELF_SIGNED} ${INGRESS_ANNOTATIONS} ${NEXTCLOUD_TAG} ${PORTAL_SHA} ${MEET_TAG} ${ELEMENT_TAG} ${COLLABORA_TAG} ${KC_BACKCHANNEL}' \
            < helmfile/demo-values.yaml.tmpl > /tmp/opensuite-values.yaml
          node ci/test-collabora-image-runtime.mjs --verify-rendered-values \
            /tmp/opensuite-values.yaml "$COLLABORA_TAG"
          python3 - <<'PY'
          import os, pathlib
          rendered = pathlib.Path('/tmp/opensuite-values.yaml').read_text()
          if '${' in rendered:
              raise SystemExit('unrendered variable in demo values')
          for expected in (
              'example.test',
              f"sha-{os.environ['PORTAL_SHA']}",
              '34.0.0-apache',
              os.environ['COLLABORA_TAG'],
          ):
              if expected not in rendered:
                  raise SystemExit(f'missing rendered value: {expected}')
          PY

  patch-series:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Apply infra patch series
        run: |
          ref=$(cat UPSTREAM_REF)
          git clone -q https://github.com/MinBZK/mijn-bureau-infra /tmp/infra
          git -C /tmp/infra checkout -q "$ref"
          for patch in patches/local/*.patch; do
            git -C /tmp/infra apply --3way --check "$GITHUB_WORKSPACE/$patch"
          done
          for patch in patches/local/*.patch; do
            git -C /tmp/infra apply --3way "$GITHUB_WORKSPACE/$patch"
          done
      - name: Validate Collabora chart image and Service contracts
        run: node ci/test-collabora-image-runtime.mjs --verify-infra /tmp/infra
      - name: Validate Nextcloud CronJob resources
        run: bash ci/test-nextcloud-cronjob-resources.sh /tmp/infra
      - name: Validate rendered Nextcloud Whiteboard backend
        run: bash ci/test-nextcloud-whiteboard.sh /tmp/infra
      - name: Validate Docs v5.2.1 performance patches
        run: python3 ci/test-docs-v5.2.1-performance.py --infra-source /tmp/infra
      - name: Validate Element preflight cache middleware
        run: |
          curl -fsSL https://github.com/helmfile/helmfile/releases/download/v1.1.7/helmfile_1.1.7_linux_amd64.tar.gz \
            | tar -xz -C /tmp helmfile
          python3 - <<'PY'
          from pathlib import Path

          rendered = Path('helmfile/demo-values.yaml.tmpl').read_text()
          values = {
              'DOMAIN': 'example.test',
              'TLS_SELF_SIGNED': 'true',
              'INGRESS_ANNOTATIONS': '',
              'NEXTCLOUD_TAG': '34.0.0-apache',
              'PORTAL_SHA': '34512e5',
              'MEET_TAG': 'v1.20.0',
              'ELEMENT_TAG': 'sha-test',
              'COLLABORA_TAG': 'sha-test',
              'KC_BACKCHANNEL': 'http://keycloak-keycloak.mb-keycloak',
          }
          for name, value in values.items():
              rendered = rendered.replace('${' + name + '}', value)
          destination = Path('/tmp/infra/helmfile/environments/demo/mijnbureau.yaml.gotmpl')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(rendered)
          PY
          (
            cd /tmp/infra
            PATH="/tmp:${PATH}" \
              MIJNBUREAU_MASTER_PASSWORD=test-password \
              MIJNBUREAU_CREATE_NAMESPACES=false \
              /tmp/helmfile -e demo --selector name=synapse template --skip-needs \
              > /tmp/synapse-rendered.yaml
          )
          node ci/test-element-quick-wins.mjs --verify-rendered /tmp/synapse-rendered.yaml
      - name: Assemble patched Meet source
        run: |
          git clone -q --depth 1 --branch v1.20.0 https://github.com/suitenumerique/meet.git /tmp/meet
          for patch in patches/meet/*.patch; do
            git -C /tmp/meet apply --check "$GITHUB_WORKSPACE/$patch"
            git -C /tmp/meet apply "$GITHUB_WORKSPACE/$patch"
          done

  element-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: performance/package-lock.json
      - name: Install pinned browser
        run: |
          npm ci --prefix performance
          npx --prefix performance playwright install --with-deps chromium
      - name: Test Element notification/search geometry
        run: node ci/test-element-quick-wins.mjs --layout
